{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block heading %}登录{% endblock %}
{% block content %}
{% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('auth.login_submit') }}" class="stack">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>学号<input type="text" name="student_no" required autocomplete="username"></label>
  <label>密码<input type="password" name="password" required autocomplete="current-password"></label>
  <button type="submit">登录</button>
</form>
<p class="hint">还没有账号？<a href="{{ url_for('auth.register_form') }}">用学号注册</a></p>
{% endblock %}
