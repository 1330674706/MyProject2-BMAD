{% extends "base.html" %}
{% block title %}注册{% endblock %}
{% block heading %}注册{% endblock %}
{% block content %}
{% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('auth.register_submit') }}" class="stack">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>学号<input type="text" name="student_no" required autocomplete="username"></label>
  <label>密码<input type="password" name="password" required autocomplete="new-password"></label>
  <button type="submit">注册</button>
</form>
<p class="hint">已有账号？<a href="{{ url_for('auth.login_form') }}">去登录</a></p>
{% endblock %}
